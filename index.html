<script>
document.addEventListener("DOMContentLoaded", () => {
  const hasBooted = localStorage.getItem("booted");
  const bootScreen = document.getElementById("boot-screen")
  const mainContent = document.getElementById("main-content")
  const bootText = document.getElementById("boot-text")
  if (hasBooted) {
    bootScreen.style.display = "none";
    mainContent.style.display = "block";
  } else {
      const lines = ["Initialising System...", "Detected User!", "Connecting to Network...", "Access Granted!", "Launching HexaInterface..."];
  let i = 0;
  let j = 0;
  const speed = 15;

  function typeLine() {
    if (i < lines.length) {
      if (j < lines[i].length) {
        bootText.textContent += lines[i].charAt(j);
        j++;
        setTimeout(typeLine, speed);
      } else {
        bootText.innerHTML += "\n";
        i++;
        j = 0;
        setTimeout(typeLine, 1000);
      }
    } else {
      setTimeout(() => {
        bootScreen.style.display = "none";
        mainContent.style.display = "block";

        localStorage.setItem("booted", "true");
      }, 800);
    }
   }
   typeLine();
  }

});
</script>
